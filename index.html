<!-- vocab-app v2.3 — 关卡制 + 反向考核 + 单词点击 + 猫剪影 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>🐱 猫语·句子本</title>
<style>
:root { --bg:#faf8f5; --card:#fff; --primary:#f0835a; --primary-light:#fff3ee; --text:#2d2a26; --text-secondary:#8c8680; --border:#ede8e2; --success:#5cb85c; --danger:#e05555; --warn:#f5a623; --rare:#9b59b6; --legend:#e8a030; --shadow-sm:0 1px 3px rgba(0,0,0,.04); --shadow:0 2px 10px rgba(0,0,0,.06); --radius:16px; --radius-sm:10px; --nav-h:64px; --safe-bottom:env(safe-area-inset-bottom,0px); }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); height:100dvh; overflow:hidden; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-font-smoothing:antialiased; }
header { background:var(--card); padding:12px 16px; text-align:center; font-weight:700; font-size:17px; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; }
header .streak { font-size:13px; color:var(--warn); font-weight:600; }
main { height:calc(100dvh - var(--nav-h) - 45px); overflow-y:auto; padding:14px; -webkit-overflow-scrolling:touch; }
.tab-content { display:none; } .tab-content.active { display:block; }
nav { position:fixed; bottom:0; left:0; right:0; height:var(--nav-h); background:var(--card); border-top:1px solid var(--border); display:flex; padding-bottom:var(--safe-bottom); z-index:10; }
nav button { flex:1; border:none; background:none; font-size:11px; color:var(--text-secondary); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; position:relative; transition:color .2s; }
nav button .icon { font-size:20px; } nav button.active { color:var(--primary); font-weight:600; } nav button.active::after { content:''; position:absolute; bottom:2px; width:4px; height:4px; border-radius:50%; background:var(--primary); }
.card { background:var(--card); border-radius:var(--radius); padding:18px; margin-bottom:12px; box-shadow:var(--shadow); border:1px solid var(--border); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:11px 20px; border-radius:var(--radius-sm); font-size:15px; font-weight:600; border:none; cursor:pointer; transition:all .15s; width:100%; }
.btn-primary { background:var(--primary); color:#fff; } .btn-primary:active { opacity:.85; transform:scale(.98); }
.btn-sm { padding:7px 14px; font-size:13px; width:auto; border-radius:8px; }
.btn-outline { background:var(--card); border:1.5px solid var(--border); color:var(--text); }
.btn-success { background:var(--success); color:#fff; border-radius:10px; } .btn-success:active { opacity:.85; transform:scale(.97); }
.btn-danger { background:var(--danger); color:#fff; border-radius:10px; } .btn-danger:active { opacity:.85; transform:scale(.97); }
.btn-warn { background:var(--warn); color:#fff; border-radius:10px; }
.btn-group { display:flex; gap:10px; } .btn-group .btn { flex:1; }

/* Home */
.garden { text-align:center; padding:10px 0; }
.bowls { display:flex; justify-content:center; gap:16px; margin-bottom:14px; }
.bowl { width:80px; height:80px; border-radius:50%; background:var(--bg); border:3px dashed var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative; transition:all .2s; }
.bowl.has-food { border-style:solid; border-color:var(--warn); background:#fffbf0; }
.bowl .bowl-emoji { font-size:28px; } .bowl .bowl-label { font-size:10px; color:var(--text-secondary); margin-top:2px; }
.cat-visitor { font-size:52px; animation:bounceIn .5s; margin:10px 0; }
@keyframes bounceIn { 0%{transform:scale(0);} 60%{transform:scale(1.2);} 100%{transform:scale(1);} }
.cat-message { background:var(--card); border-radius:var(--radius-sm); padding:14px 18px; margin:8px 0; font-size:15px; line-height:1.5; border-left:4px solid var(--primary); text-align:left; }
.stats-row { display:flex; gap:10px; margin-top:12px; }
.stat-card { flex:1; background:var(--card); border-radius:var(--radius-sm); padding:12px; text-align:center; box-shadow:var(--shadow-sm); border:1px solid var(--border); }
.stat-card .num { font-size:22px; font-weight:800; color:var(--primary); } .stat-card .lbl { font-size:11px; color:var(--text-secondary); margin-top:2px; }
.inventory-bar { margin-top:12px; } .inventory-item { display:inline-flex; align-items:center; gap:4px; margin:0 8px; font-size:14px; font-weight:600; }
.food-opt { padding:10px 12px; margin:4px 0; background:var(--bg); border-radius:var(--radius-sm); cursor:pointer; font-size:15px; font-weight:600; transition:all .1s; }
.food-opt:active { background:var(--primary-light); }

/* Level Map */
.level-list { display:flex; flex-direction:column; gap:8px; }
.level-row { display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--card); border-radius:var(--radius-sm); box-shadow:var(--shadow-sm); border:1px solid var(--border); }
.level-row.locked { opacity:.5; }
.level-row.current { border-color:var(--primary); background:var(--primary-light); }
.level-row .lv-icon { font-size:28px; width:40px; text-align:center; }
.level-row .lv-info { flex:1; }
.level-row .lv-info .lv-title { font-weight:700; font-size:15px; }
.level-row .lv-info .lv-sub { font-size:12px; color:var(--text-secondary); }
.level-row .lv-badge { font-size:12px; padding:4px 10px; border-radius:12px; font-weight:600; }
.lv-badge.done { background:#e8f5e9; color:var(--success); }
.lv-badge.open { background:var(--primary-light); color:var(--primary); }
.lv-badge.locked-badge { background:var(--bg); color:var(--text-secondary); }

/* Sentence Card */
.sentence-card { background:var(--card); border-radius:var(--radius); padding:22px 18px; margin-bottom:14px; box-shadow:var(--shadow); border:1px solid var(--border); text-align:center; cursor:pointer; transition:all .2s; min-height:130px; display:flex; flex-direction:column; justify-content:center; }
.sentence-card:active { transform:scale(.98); }
.sentence-card .en { font-size:19px; line-height:2.0; font-weight:500; }
.sentence-card .en .w { padding:1px 3px; border-radius:3px; cursor:pointer; transition:background .1s; border-bottom:1px dashed transparent; }
.sentence-card .en .w:active { background:var(--primary-light); border-bottom-color:var(--primary); }
.sentence-card .hint { font-size:13px; color:var(--text-secondary); margin-top:6px; }
.sentence-card .zh { font-size:17px; color:var(--primary); margin-top:10px; display:none; line-height:1.6; }
.sentence-card.revealed .zh { display:block; animation:fadeIn .3s; }
.sentence-card.revealed .hint { display:none; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
.sentence-nav { display:flex; gap:8px; align-items:center; justify-content:center; margin-top:10px; }
.sentence-nav .page-info { font-size:13px; color:var(--text-secondary); }

/* Quiz */
.quiz-card { background:var(--card); border-radius:var(--radius); padding:28px 20px; margin-bottom:14px; box-shadow:var(--shadow); border:1px solid var(--border); text-align:center; min-height:180px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.quiz-card .q-zh { font-size:24px; font-weight:700; margin-bottom:16px; line-height:1.5; }
.quiz-card .q-input { width:100%; padding:12px; border:2px solid var(--border); border-radius:var(--radius-sm); font-size:16px; text-align:center; font-family:inherit; }
.quiz-card .q-input:focus { outline:none; border-color:var(--primary); }
.quiz-card .q-submit { margin-top:10px; }
.quiz-feedback { text-align:center; padding:20px; }
.quiz-feedback .qf-your { font-size:16px; margin-bottom:6px; }
.quiz-feedback .qf-correct { font-size:17px; color:var(--success); font-weight:600; margin-bottom:14px; }

/* Catbook */
.cat-card { background:var(--card); border-radius:var(--radius); padding:16px; margin-bottom:10px; box-shadow:var(--shadow-sm); border:1px solid var(--border); display:flex; gap:14px; align-items:center; }
.cat-card.locked { opacity:.6; }
.cat-card.locked .cat-emoji { filter:brightness(0); }
.cat-card .cat-emoji { font-size:44px; } .cat-card .cat-info { flex:1; }
.cat-card .cat-info .cname { font-size:17px; font-weight:700; } .cat-card .cat-info .cpersonality { font-size:13px; color:var(--text-secondary); }
.cat-card .cat-stats { text-align:right; font-size:12px; color:var(--text-secondary); }
.cat-detail { text-align:center; padding:20px; } .cat-detail .big-emoji { font-size:72px; margin-bottom:10px; }
.cat-msgs { margin-top:10px; }
.cat-msg-item { padding:10px 14px; background:var(--bg); border-radius:var(--radius-sm); margin-bottom:6px; font-size:14px; line-height:1.5; text-align:left; }
.cat-msg-item .time { font-size:11px; color:var(--text-secondary); display:block; margin-top:4px; }

/* Word Bubble */
.word-bubble { position:fixed; z-index:90; background:var(--card); border-radius:var(--radius-sm); padding:14px 18px; box-shadow:0 8px 30px rgba(0,0,0,.15); text-align:center; max-width:260px; }
.word-bubble .wb-word { font-size:22px; font-weight:700; }
.word-bubble .wb-phonetic { font-size:13px; color:var(--text-secondary); margin:4px 0; }
.word-bubble .wb-meaning { font-size:15px; color:var(--primary); }

/* Modal */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:100; align-items:flex-end; justify-content:center; backdrop-filter:blur(2px); }
.modal-overlay.show { display:flex; }
.modal { background:var(--card); border-radius:20px 20px 0 0; width:100%; max-width:500px; max-height:72vh; overflow-y:auto; padding:24px 18px 20px; animation:slideUp .25s ease-out; }
@keyframes slideUp { from{transform:translateY(100%);} to{transform:translateY(0);} }
.modal h2 { font-size:24px; margin-bottom:8px; }

.toast { position:fixed; top:60px; left:50%; transform:translateX(-50%); background:#2d2a26; color:#fff; padding:10px 20px; border-radius:20px; font-size:14px; z-index:200; opacity:0; transition:opacity .3s; pointer-events:none; }
.toast.show { opacity:1; }
.reward-popup { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0); background:var(--card); border-radius:var(--radius); padding:30px 24px; text-align:center; z-index:150; box-shadow:0 20px 60px rgba(0,0,0,.2); transition:transform .3s cubic-bezier(.175,.885,.32,1.275); }
.reward-popup.show { transform:translate(-50%,-50%) scale(1); }
.reward-popup .rp-icon { font-size:64px; } .reward-popup .rp-text { font-size:16px; margin-top:8px; font-weight:600; } .reward-popup .rp-close { margin-top:14px; }
.empty { text-align:center; padding:48px 20px; color:var(--text-secondary); } .empty .icon { font-size:48px; margin-bottom:12px; }
</style>
</head>
<body>

<header>
  <span>🐱 猫语·句子本</span>
  <span class="streak" id="streak-badge">🔥 0 days</span>
</header>

<main>
  <!-- Tab 1: Home -->
  <div class="tab-content active" id="tab-home">
    <div class="garden" id="garden">
      <div class="bowls" id="bowls-container"></div>
      <div id="food-picker" style="display:none;background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);">
        <div style="font-weight:700;margin-bottom:8px;">🍽️ 选择食物</div>
        <div id="food-pick-list"></div>
        <button class="btn btn-outline btn-sm" style="margin-top:8px;width:100%;" onclick="document.getElementById('food-picker').style.display='none'">取消</button>
      </div>
      <div id="cat-visitor-area"></div>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="num" id="stat-level">1</div><div class="lbl">📂 当前关卡</div></div>
      <div class="stat-card"><div class="num" id="stat-mastered">0</div><div class="lbl">🌟 已掌握</div></div>
      <div class="stat-card"><div class="num" id="stat-cats">0</div><div class="lbl">🐱 已解锁</div></div>
    </div>
    <div class="inventory-bar">
      <span class="inventory-item">🥫 <span id="inv-fish">0</span></span>
      <span class="inventory-item">🍣 <span id="inv-tuna">0</span></span>
      <span class="inventory-item">👑 <span id="inv-king">0</span></span>
    </div>
  </div>

  <!-- Tab 2: Learn -->
  <div class="tab-content" id="tab-learn">
    <div id="level-map"></div>
    <div id="learn-area" style="display:none;">
      <div id="learn-card-area"></div>
      <div class="sentence-nav" id="learn-nav">
        <button class="btn btn-outline btn-sm" onclick="App.navLearn(-1)">←</button>
        <span class="page-info" id="learn-page"></span>
        <button class="btn btn-outline btn-sm" onclick="App.navLearn(1)">→</button>
      </div>
      <button class="btn btn-outline btn-sm" style="margin-top:10px;width:100%;" onclick="App.backToLevelMap()">← 返回关卡地图</button>
    </div>
  </div>

  <!-- Tab 3: Quiz -->
  <div class="tab-content" id="tab-quiz">
    <div class="empty" id="quiz-empty"><div class="icon">✅</div><p id="quiz-empty-text">先去学习模式通关本关吧</p></div>
    <div id="quiz-area" style="display:none;"></div>
  </div>

  <!-- Tab 4: Catbook -->
  <div class="tab-content" id="tab-catbook">
    <div class="empty" id="catbook-empty"><div class="icon">🐱</div><p>还没有解锁猫咪</p></div>
    <div id="catbook-list"></div>
  </div>

  <!-- Tab 5: Settings -->
  <div class="tab-content" id="tab-settings">
    <div class="card"><h3>📂 模块</h3><p style="color:var(--text-secondary);font-size:14px;">🍽️ 美食英语 · 7关25句</p></div>
    <div class="card"><h3>🎒 库存</h3><p style="font-size:14px;">🥫 小鱼干 × <span id="set-fish">0</span></p><p style="font-size:14px;">🍣 金枪鱼 × <span id="set-tuna">0</span></p><p style="font-size:14px;">👑 帝王鲑 × <span id="set-king">0</span></p></div>
    <div class="card"><h3>🛠️</h3><button class="btn btn-outline btn-sm" onclick="App.resetAll()" style="color:var(--danger);">重置所有数据</button></div>
  </div>
</main>

<nav>
  <button class="active" data-tab="home"><span class="icon">🏠</span>首页</button>
  <button data-tab="learn"><span class="icon">📖</span>学习</button>
  <button data-tab="quiz"><span class="icon">✅</span>考核</button>
  <button data-tab="catbook"><span class="icon">🐱</span>猫册</button>
  <button data-tab="settings"><span class="icon">⚙️</span>设置</button>
</nav>

<div class="word-bubble" id="word-bubble" style="display:none;" onclick="document.getElementById('word-bubble').style.display='none'"></div>
<div class="reward-popup" id="reward-popup">
  <div class="rp-icon" id="rp-icon"></div><div class="rp-text" id="rp-text"></div>
  <button class="btn btn-primary btn-sm rp-close" onclick="App.closeReward()">太棒了！</button>
</div>
<div class="modal-overlay" id="cat-modal" onclick="App.closeCatModal(event)"><div class="modal" id="cat-modal-content" onclick="event.stopPropagation()"></div></div>
<div class="toast" id="toast"></div>

// ═══ APP ═══
const App = {
  db:null, todayStr:new Date().toISOString().split('T')[0],
  learnSentences:[], learnIndex:0, currentLevelId:1,
  quizSentences:[], quizIndex:0, quizCurrent:null,

  async init(){
    await this.openDB(); await this.seedData();
    this._initVoices();
    this.bindNav(); await this.checkStreak(); await this.refreshHome();
  },

  // ── DB ──
  openDB(){return new Promise((resolve,reject)=>{
    const req=indexedDB.open('CatVocabV2',2);
    req.onupgradeneeded=(e)=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('sentences')){const s=db.createObjectStore('sentences',{keyPath:'id',autoIncrement:true});s.createIndex('level','level',{unique:false});}
      if(!db.objectStoreNames.contains('progress'))db.createObjectStore('progress',{keyPath:'key'});
      if(!db.objectStoreNames.contains('inventory'))db.createObjectStore('inventory',{keyPath:'key'});
      if(!db.objectStoreNames.contains('cats'))db.createObjectStore('cats',{keyPath:'id'});
      if(!db.objectStoreNames.contains('bowls'))db.createObjectStore('bowls',{keyPath:'slot',autoIncrement:true});
      if(!db.objectStoreNames.contains('streaks'))db.createObjectStore('streaks',{keyPath:'key'});
      if(!db.objectStoreNames.contains('messages')){const m=db.createObjectStore('messages',{keyPath:'id',autoIncrement:true});m.createIndex('catId','catId',{unique:false});}
    };
    req.onsuccess=(e)=>{this.db=e.target.result;resolve();}; req.onerror=()=>reject(req.error);
  })},
  dbGet(s,id){return new Promise(r=>{const tx=this.db.transaction(s,'readonly');const req=tx.objectStore(s).get(id);req.onsuccess=()=>r(req.result);req.onerror=()=>r(null);});},
  dbGetAll(s){return new Promise(r=>{const tx=this.db.transaction(s,'readonly');const req=tx.objectStore(s).getAll();req.onsuccess=()=>r(req.result);req.onerror=()=>r([]);});},
  dbPut(s,o){return new Promise(r=>{const tx=this.db.transaction(s,'readwrite');const req=tx.objectStore(s).put(o);req.onsuccess=()=>r(req.result);req.onerror=()=>r(null);});},
  dbDelete(s,id){return new Promise(r=>{const tx=this.db.transaction(s,'readwrite');tx.objectStore(s).delete(id);tx.oncomplete=()=>r();});},

  async seedData(){
    let sents=await this.dbGetAll('sentences');
    // Detect old V2.0 data without level field → reseed
    if(sents.length>0 && sents[0].level===undefined){
      const tx=this.db.transaction('sentences','readwrite');tx.objectStore('sentences').clear();await new Promise(r=>{tx.oncomplete=r;});
      sents=[];
    }
    if(sents.length===0){
      for(const L of LEVELS) for(const s of L.sentences)
        await this.dbPut('sentences',{...s,level:L.id,module:'food',archived:false,mastered:false,reviewCount:0,nextReviewDate:this.todayStr,reviewInterval:0,lastReviewed:null});
    }
    const inv=await this.dbGet('inventory','food'); if(!inv) await this.dbPut('inventory',{key:'food',fish:3,tuna:0,king:0});
    const prog=await this.dbGet('progress','main'); if(!prog) await this.dbPut('progress',{key:'main',currentLevel:1,completedLevels:[]});
    const streak=await this.dbGet('streaks','daily'); if(!streak) await this.dbPut('streaks',{key:'daily',count:0,lastDate:null,freezeCards:0});
    // Detect old V2.x cats (with emoji) → reseed
    const oldCats=await this.dbGetAll('cats');
    if(oldCats.length>0&&oldCats[0].emoji!==undefined){const tx=this.db.transaction('cats','readwrite');tx.objectStore('cats').clear();await new Promise(r=>{tx.oncomplete=r;});}
    for(const c of CATS){const ex=await this.dbGet('cats',c.id);if(!ex)await this.dbPut('cats',{...c,unlocked:!c.conditionType,visitCount:0,lastVisit:null,unlockedAt:c.conditionType?null:new Date().toISOString()});}
    const bowls=await this.dbGetAll('bowls'); if(bowls.length===0) await this.dbPut('bowls',{slot:1,foodType:null,placedAt:null});
  },

  toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(this._t);this._t=setTimeout(()=>e.classList.remove('show'),2000);},
  showReward(i,t){document.getElementById('rp-icon').textContent=i;document.getElementById('rp-text').textContent=t;document.getElementById('reward-popup').classList.add('show');},
  closeReward(){document.getElementById('reward-popup').classList.remove('show');},
  async getProgress(){return await this.dbGet('progress','main');},

  // ── Nav ──
  bindNav(){
    document.querySelectorAll('nav button').forEach(btn=>{btn.addEventListener('click',async()=>{
      document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
      document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
      if(btn.dataset.tab==='home')await this.refreshHome();
      if(btn.dataset.tab==='learn')await this.showLevelMap();
      if(btn.dataset.tab==='quiz')await this.prepareQuiz();
      if(btn.dataset.tab==='catbook')await this.refreshCatbook();
      if(btn.dataset.tab==='settings')await this.refreshSettings();
    });});
  },

  // ── HOME ──
  async refreshHome(){
    const inv=await this.dbGet('inventory','food');
    document.getElementById('inv-fish').textContent=inv?.fish||0;document.getElementById('inv-tuna').textContent=inv?.tuna||0;document.getElementById('inv-king').textContent=inv?.king||0;
    const streak=await this.dbGet('streaks','daily');document.getElementById('streak-badge').textContent=`🔥 ${streak?.count||0} days`;
    const sents=await this.dbGetAll('sentences');const mastered=sents.filter(s=>s.mastered).length;
    const cats=await this.dbGetAll('cats');const unlocked=cats.filter(c=>c.unlocked).length;
    const prog=await this.getProgress();
    document.getElementById('stat-level').textContent=prog?.currentLevel||1;document.getElementById('stat-mastered').textContent=mastered;document.getElementById('stat-cats').textContent=unlocked;
    const bowls=await this.dbGetAll('bowls');document.getElementById('bowls-container').innerHTML=bowls.map(b=>{
      const em=b.foodType==='fish'?'🥫':b.foodType==='tuna'?'🍣':b.foodType==='king'?'👑':'🥣';
      return `<div class="bowl ${b.foodType?'has-food':''}" onclick="App.tapBowl(${b.slot})"><div class="bowl-emoji">${em}</div><div class="bowl-label">食盆</div></div>`;
    }).join('');
    await this.checkCatVisits();
  },

  async tapBowl(slot){
    const bowl=await this.dbGet('bowls',slot);if(!bowl)return;
    if(bowl.foodType&&bowl.placedAt){await this.checkCatVisits();return;}
    const inv=await this.dbGet('inventory','food');
    const items=[];
    if(inv.fish>0)items.push({type:'fish',emoji:'🥫',label:'小鱼干',count:inv.fish});
    if(inv.tuna>0)items.push({type:'tuna',emoji:'🍣',label:'金枪鱼罐头',count:inv.tuna});
    if(inv.king>0)items.push({type:'king',emoji:'👑',label:'帝王鲑',count:inv.king});
    if(!items.length){this.toast('没有食物了！去考核赚吧');return;}
    // Show food picker
    const picker=document.getElementById('food-picker');const list=document.getElementById('food-pick-list');
    list.innerHTML=items.map(f=>`<div class="food-opt" onclick="App.placeFood(${slot},'${f.type}')">${f.emoji} ${f.label} ×${f.count}</div>`).join('');
    picker.style.display='block';
  },
  async placeFood(slot,type){
    document.getElementById('food-picker').style.display='none';
    const bowl=await this.dbGet('bowls',slot);const inv=await this.dbGet('inventory','food');
    if(!inv[type]||inv[type]<1)return this.toast('食物不够了');
    inv[type]--;await this.dbPut('inventory',inv);
    bowl.foodType=type;bowl.placedAt=Date.now();await this.dbPut('bowls',bowl);
    this.toast('食物放好了！等会儿来看猫');await this.refreshHome();
  },

  async checkCatVisits(){
    const bowls=await this.dbGetAll('bowls');let html='';
    for(const bowl of bowls){
      if(!bowl.foodType||!bowl.placedAt)continue;
      const elapsed=(Date.now()-bowl.placedAt)/1000/60;
      const th=bowl.foodType==='king'?5:bowl.foodType==='tuna'?15:30;
      if(elapsed<th){html+=`<div style="font-size:13px;color:var(--text-secondary);text-align:center;">🕐 ~${Math.ceil(th-elapsed)}分钟后猫可能来</div>`;continue;}
      const cat=await this._pickCatForFood(bowl.foodType);
      if(!cat){html+=`<div style="font-size:13px;color:var(--text-secondary);text-align:center;">食物被吃光了，没看到猫</div>`;}
      else{
        const ci=catImg(cat);
        html+=ci?`<img src="${ci}" class="cat-visitor" style="width:80px;height:80px;border-radius:50%;object-fit:cover;">`:`<div class="cat-visitor" style="font-size:52px;">🐱</div>`;
        const pool=CAT_MSGS[cat.personality]?.[bowl.foodType]||CAT_MSGS['贪吃傻白甜'][bowl.foodType];
        const msg=pool[Math.floor(Math.random()*pool.length)];
        html+=`<div class="cat-message"><b>${cat.name}:</b> "${msg}"</div>`;
        cat.visitCount=(cat.visitCount||0)+1;cat.lastVisit=new Date().toISOString();
        await this.dbPut('cats',cat);
        await this.dbPut('messages',{catId:cat.id,message:msg,foodType:bowl.foodType,createdAt:new Date().toISOString()});
      }
      bowl.foodType=null;bowl.placedAt=null;await this.dbPut('bowls',bowl);
    }
    document.getElementById('cat-visitor-area').innerHTML=html;
  },

  async _pickCatForFood(ft){
    const cats=await this.dbGetAll('cats');const unlocked=cats.filter(c=>c.unlocked);if(!unlocked.length)return null;
    // Sort by last visit (null = never visited, prefer those)
    unlocked.sort((a,b)=>(a.lastVisit||'').localeCompare(b.lastVisit||''));
    const pool=[];
    for(const c of unlocked){
      // Rarity 1-6: higher rarity = lower base weight (harder to attract)
      const baseW=[0,65,50,35,22,14,8][c.rarity];
      let w=baseW;
      // Food quality boosts rare cat odds
      if(ft==='king')w=c.rarity>=5?45:c.rarity>=3?35:20;
      if(ft==='tuna')w=c.rarity>=4?35:c.rarity>=2?50:20;
      // Recently visited (<2h ago)? Halve weight
      if(c.lastVisit){
        const hrs=(Date.now()-new Date(c.lastVisit).getTime())/3600000;
        if(hrs<2)w=Math.floor(w/2);
        // Never visited? Double weight
      }else{w*=2;}
      for(let i=0;i<Math.max(w,1);i++)pool.push(c);
    }
    return pool[Math.floor(Math.random()*pool.length)];
  },

  async checkStreak(){
    const streak=await this.dbGet('streaks','daily');const today=this.todayStr;
    if(streak.lastDate===today)return;
    const y=new Date();y.setDate(y.getDate()-1);const ys=y.toISOString().split('T')[0];
    if(streak.lastDate===ys){streak.count++;streak.lastDate=today;await this.dbPut('streaks',streak);
      if(streak.count===7){await this.gainFood('king',1);this.showReward('👑','连续7天！+帝王鲑×1！');}
    }else if(streak.freezeCards>0){streak.freezeCards--;streak.count++;streak.lastDate=today;this.toast('❄️冰冻卡已使用');}
    else{streak.count=1;streak.lastDate=today;}
    await this.dbPut('streaks',streak);
    await this._checkCatUnlocks();
  },

  async _checkCatUnlocks(){
    const cats=await this.dbGetAll('cats');const sents=await this.dbGetAll('sentences');const mastered=sents.filter(s=>s.mastered).length;
    const streak=await this.dbGet('streaks','daily');const prog=await this.getProgress();
    for(const c of cats){
      if(c.unlocked||!c.conditionType)continue;
      let met=false;
      if(c.conditionType==='level')met=prog.completedLevels.includes(c.conditionVal);
      if(c.conditionType==='streak')met=(streak?.count||0)>=c.conditionVal;
      if(met){c.unlocked=true;c.unlockedAt=new Date().toISOString();await this.dbPut('cats',c);this.showReward('🐱',`🔓解锁新猫：${c.nameCN}！`);}
    }
  },

  async gainFood(type,n){const inv=await this.dbGet('inventory','food');inv[type]=(inv[type]||0)+n;await this.dbPut('inventory',inv);},

  // ── LEVEL MAP ──

        <button class="btn btn-primary btn-sm" style="margin-top:8px;width:100%;" onclick="App.importArticle()">拆解句子</button>

  // ── Overview ──
  async toggleOverview(){
    const area=document.getElementById('overview-area');
    if(area.style.display==='block'){area.style.display='none';return;}
    const sents=await this.dbGetAll('sentences');
    const grouped={};
    for(const s of sents){

      if(!grouped[lvl])grouped[lvl]=[];
      grouped[lvl].push(s);

      html+=`<div style="font-weight:700;font-size:14px;margin:10px 0 4px;">${lvl} (${items.length}句)</div>`;
      for(const s of items){
        const preview=s.en.length>45?s.en.substring(0,45)+'…':s.en;

  async retranslate(id){
    const s=await this.dbGet('sentences',id);if(!s)return;
    try{
      const r=await Promise.race([fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q='+encodeURIComponent(s.en),{referrerPolicy:'strict-origin-when-cross-origin'}),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),5000))]);
      if(r.ok){const d=await r.json();s.zh=(d[0]||[]).map(i=>i[0]).join('');await this.dbPut('sentences',s);this.toast('重译成功');}
    }catch(e){this.toast('重译失败');}
    this.toggleOverview();
  },

    const s=await this.dbGet('sentences',id);if(!s)return;
    s.archived=!s.archived;await this.dbPut('sentences',s);
    this.toast(s.archived?'已归档，不再出现':'已恢复');

  toggleImport(){

  async importArticle(){
    const text=document.getElementById('import-text').value.trim();
    if(!text)return this.toast('请先粘贴文章');
    const sentences=text.split(/(?<=[.!?])\s+/).filter(s=>s.trim().length>10);
    if(!sentences.length)return this.toast('未识别到句子');
    const container=document.getElementById('import-sentences');
    container.innerHTML='<p style="color:var(--text-secondary);">翻译中…</p>';
    const results=[];
    for(const s of sentences){
      let zh='';
      try{
        const r=await Promise.race([fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=${encodeURIComponent(s.trim())}`,{referrerPolicy:"strict-origin-when-cross-origin"}),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),5000))]);
        if(r.ok){const d=await r.json();zh=(d[0]||[]).map(i=>i[0]).join('');}
      }catch(e){zh='翻译失败';}
      results.push({en:s.trim(),zh});
    }
    container.innerHTML=results.map((r,i)=>`
      <div style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);">
        <input type="checkbox" id="imp-${i}" checked style="margin-top:3px;">
        <label for="imp-${i}" style="flex:1;font-size:13px;">
          <div>${this.esc(r.en)}</div>
          <div style="color:var(--primary);font-size:12px;">${this.esc(r.zh)||'翻译失败'}</div>
        </label>
      </div>
    `).join('')+`<button class="btn btn-primary btn-sm" style="margin-top:10px;width:100%;" onclick="App.saveImported()">保存勾选的句子</button>`;
    window._importResults=results;
  },

  async saveImported(){
    const results=window._importResults;if(!results)return;
    let count=0;
    for(let i=0;i<results.length;i++){
      if(document.getElementById('imp-'+i)?.checked){
        await this.dbPut('sentences',{en:results[i].en,zh:results[i].zh,level:0,module:'custom',archived:false,mastered:false,reviewCount:0,nextReviewDate:this.todayStr,reviewInterval:0,lastReviewed:null});
        count++;
      }
    }
    document.getElementById('import-text').value='';document.getElementById('import-sentences').innerHTML='';
    this.toast(`已导入${count}句`);this.showLevelMap();
  },

  renderLearnCard(){
    if(this.learnSentences.length===0)return;
    const s=this.learnSentences[this.learnIndex];
    document.getElementById('learn-page').textContent=`${this.learnIndex+1}/${this.learnSentences.length}`;
    const tokens=s.en.match(/[\w'’]+|[^\w'’\s]+|\s+/g)||[];
    const parts=tokens.map(t=>{
      if(/^\s+$/.test(t))return t;
      if(/^[^\w'’]+$/.test(t))return this.esc(t);
      return `<span class="w" data-word="${this.esc(t.toLowerCase().replace(/[^a-zA-Z'’]/g,''))}">${this.esc(t)}</span>`;
    }).join('');
    document.getElementById('learn-card-area').innerHTML=`
      <div class="sentence-card" id="learn-card" onclick="App.revealLearnCard(event)">
        <div class="en">${parts}</div><div class="hint">👆点击翻看翻译</div>
        <div class="zh">${this.esc(s.zh)}</div>
      </div>
      <div style="text-align:center;margin-top:8px;">
        <button class="btn btn-outline btn-sm" onclick="App.speakNow(this)" data-text="${this.esc(s.en)}">🔊 朗读</button>
      </div>`;
    // Bind word clicks
    document.querySelectorAll('#learn-card-area .w').forEach(el=>{el.addEventListener('click',e=>{e.stopPropagation();this.wordClick(el.dataset.word,e);});});
  },

  revealLearnCard(e){
    if(e.target.classList.contains('w'))return;
    document.getElementById('learn-card').classList.add('revealed');
  },
  navLearn(dir){const len=this.learnSentences.length;if(!len)return;this.learnIndex=(this.learnIndex+dir+len)%len;this.renderLearnCard();},

  async wordClick(word,ev){
    const b=document.getElementById('word-bubble');
    b.innerHTML=`<div class="wb-word">${this.esc(word)}</div><div class="wb-phonetic">查询中…</div><div class="wb-meaning"></div><div style="font-size:11px;margin-top:4px;color:var(--text-secondary);">👆点击关闭</div>`;
    // Position near tap
    const x=ev.clientX||(ev.touches&&ev.touches[0].clientX)||100;const y=(ev.clientY||(ev.touches&&ev.touches[0].clientY)||200)-120;
    b.style.left=Math.min(x-130,window.innerWidth-270)+'px';b.style.top=Math.max(50,y)+'px';
    b.style.display='block';
    // Fetch
    let phonetic='';let meaning='';
    try{
      const r=await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
      if(r.ok){const d=await r.json();if(d[0])phonetic=d[0].phonetic||d[0].phonetics?.[0]?.text||'';}
    }catch(e){zh='翻译失败';}
    try{
      const r=await Promise.race([fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=${encodeURIComponent(word)}`,{referrerPolicy:"strict-origin-when-cross-origin"}),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),5000))]);
      if(r.ok){const d=await r.json();meaning=(d[0]||[]).map(i=>i[0]).join('');}
    }catch(e){zh='翻译失败';}
    b.querySelector('.wb-phonetic').textContent=phonetic||'/ /';
    b.querySelector('.wb-meaning').textContent=meaning||'翻译失败';
    // Auto speak
    this._speakGoogle(word);
    // Auto hide after 4s
    clearTimeout(this._wbTimer);this._wbTimer=setTimeout(()=>b.style.display='none',4000);
  },

  // ── TTS ──
  // TTS — try Google Cloud first, fallback to local Google voice, then any voice
  _initVoices(){
    if(!window.speechSynthesis)return;
    const load=()=>{this._allVoices=speechSynthesis.getVoices();};
    load();speechSynthesis.onvoiceschanged=load;
  },
  _bestVoice(){
    const v=this._allVoices||speechSynthesis.getVoices();
    return v.find(x=>x.lang==='en-US'&&x.name.includes('Google'))||v.find(x=>x.lang.startsWith('en'))||v[0];
  },
  speakNow(btn){const t=btn.dataset.text;if(t)this._speakGoogle(t);},
  _speakGoogle(text){
    const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&q='+encodeURIComponent(text)+'&tl=en&client=tw-ob');
    a.play().catch(()=>{this._speakFallback(text);});
  },
  _speakFallback(text){
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=0.85;
    const voice=this._bestVoice();if(voice)u.voice=voice;
    speechSynthesis.speak(u);
  },
  _splitChunks(text,max){const sents=text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[text];const chunks=[];let cur='';for(const s of sents){if(cur.length+s.length>max&&cur){chunks.push(cur.trim());cur=s;}else cur+=(cur?' ':'')+s;}if(cur.trim())chunks.push(cur.trim());return chunks.length?chunks:[text];},

  // ── QUIZ ──
  async prepareQuiz(){
    const prog=await this.getProgress();const levelId=prog.currentLevel;
    const sents=await this.dbGetAll('sentences');const today=this.todayStr;
    const levelSents=sents.filter(s=>s.level===levelId&&!s.archived);
    const due=levelSents.filter(s=>s.nextReviewDate<=today);
    this.quizSentences=due.length>0?due:levelSents;
    this.quizSentences.sort(()=>Math.random()-.5);this.quizIndex=0;
    document.getElementById('quiz-empty').style.display=this.quizSentences.length===0?'block':'none';
    document.getElementById('quiz-area').style.display=this.quizSentences.length===0?'none':'block';
    if(this.quizSentences.length===0){document.getElementById('quiz-empty-text').textContent='本关没有需要复习的句子';return;}
    this.renderQuizCard();
  },

  async renderQuizCard(){
    const s=this.quizSentences[this.quizIndex];this.quizCurrent=s;
    const cats=await this.dbGetAll('cats');const unlocked=cats.filter(c=>c.unlocked);
    const cat=unlocked.length?unlocked[Math.floor(Math.random()*unlocked.length)]:null;
    const area=document.getElementById('quiz-area');
    area.innerHTML=`
      ${cat?`<div style="text-align:center;margin-bottom:6px;"><img src="${catImg(cat)||''}" style="width:80px;height:80px;border-radius:50%;border:3px solid ${cat.rarityColor||'#ccc'};object-fit:cover;box-shadow:0 4px 12px rgba(0,0,0,.1);"><div style="font-size:13px;color:var(--text);margin-top:4px;font-weight:600;">🐱 ${cat.name}：翻译这句 👇</div></div>`:''}
      <div class="quiz-card">
        <div class="q-zh">${this.esc(s.zh)}</div>
        <input class="q-input" id="quiz-input" placeholder="输入英文翻译…" autocomplete="off">
        <button class="btn btn-primary btn-sm q-submit" onclick="App.submitQuiz()">提交</button>
      </div>
      <div id="quiz-feedback" style="display:none;padding:12px 0;"></div>
      <div class="sentence-nav" style="margin-top:8px;">${this.quizIndex+1}/${this.quizSentences.length}</div>
    `;
    document.getElementById('quiz-input').addEventListener('keydown',e=>{if(e.key==='Enter')this.submitQuiz();});
  },

  async submitQuiz(){
    const input=document.getElementById('quiz-input').value.trim();
    if(!input)return this.toast('请先输入英文');
    const s=this.quizCurrent;
    // Auto-grade: compare words
    const userWords=input.toLowerCase().split(/\s+/).filter(w=>w);
    const stdWords=s.en.toLowerCase().split(/\s+/).filter(w=>w.match(/[a-z]/));
    const matched=[];const used=new Set();
    for(const uw of userWords){
      let found=false;
      for(let i=0;i<stdWords.length;i++){
        if(used.has(i))continue;
        const sw=stdWords[i].replace(/[^a-z]/g,'');
        if(sw&&uw.replace(/[^a-z]/g,'')===sw){used.add(i);found=true;break;}
      }
      matched.push(found);
    }
    const correct=matched.filter(m=>m).length;
    const pct=stdWords.length>0?Math.round(correct/stdWords.length*100):0;
    const perfect=pct>=90&&userWords.length>=stdWords.length-2;
    // Build colored output
    let colored='';
    for(let i=0;i<userWords.length;i++){
      const cls=matched[i]?'color:var(--success);font-weight:700;':'color:var(--danger);text-decoration:line-through;';
      colored+=`<span style="${cls}">${this.esc(userWords[i])}</span> `;
    }
    // Cat reaction
    const catReaction=perfect?'😸 Perfect!':'😾 Not quite…';
    document.getElementById('quiz-feedback').style.display='block';
    document.getElementById('quiz-feedback').innerHTML=`
      <div style="margin-bottom:10px;">${colored||'—'}</div>
      <div style="font-size:14px;color:var(--text-secondary);">标准：<b>${this.esc(s.en)}</b></div>
      <div style="font-size:28px;margin:8px 0;">${catReaction}</div>
      ${perfect?'':`<button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="App.retryQuiz()">🔄 再试一次</button>`}
    `;
    if(perfect){await this.quizScore(true);setTimeout(()=>this.renderQuizCard(),1200);}
  },

  retryQuiz(){document.getElementById('quiz-feedback').style.display='none';document.getElementById('quiz-input').value='';document.getElementById('quiz-input').focus();},
  async quizScore(perfect){
    const s=this.quizCurrent;
    s.reviewCount++;s.lastReviewed=this.todayStr;
    const today=this.todayStr;
    if(perfect){
      const intervals=[1,3,7,14,30];const idx=Math.min(s.reviewInterval,intervals.length-1);
      const days=intervals[idx];const next=new Date();next.setDate(next.getDate()+days);
      s.nextReviewDate=next.toISOString().split('T')[0];
      s.reviewInterval=Math.min(s.reviewInterval+1,intervals.length-1);
      if(s.reviewInterval>=1&&!s.mastered)s.mastered=true;
    }else{s.nextReviewDate=today;s.reviewInterval=0;}
    await this.dbPut('sentences',s);
    await this.checkLevelComplete();
    const pts=perfect?3:1;
    await this.gainFood('fish',pts);
    if(perfect&&Math.random()<0.3){await this.gainFood('tuna',1);this.showReward('🍣','⭐完美！+3鱼干 + 金枪鱼！');}
    else this.toast(`+${pts}小鱼干`);
    await this.checkStreak();await this._checkCatUnlocks();await this.refreshHome();
    this.quizIndex=(this.quizIndex+1)%this.quizSentences.length;
    if(this.quizIndex===0){await this.prepareQuiz();}else{this.renderQuizCard();}
  },

  async checkLevelComplete(){
    const sents=await this.dbGetAll('sentences');const prog=await this.getProgress();
    const levelSents=sents.filter(s=>s.level===prog.currentLevel&&!s.archived);
    const allMastered=levelSents.every(s=>s.reviewInterval>=1);
    if(allMastered&&!prog.completedLevels.includes(prog.currentLevel)){
      prog.completedLevels.push(prog.currentLevel);
      if(prog.currentLevel<7){prog.currentLevel++;this.showReward('🎉',`第${prog.currentLevel-1}关通关！解锁第${prog.currentLevel}关！`);}
      else{this.showReward('🏆','全部7关通关！你已征服美食英语！');}
      await this.dbPut('progress',prog);
      await this._checkCatUnlocks();
    }
  },

  // ── CATBOOK ──
  async refreshCatbook(){
    const cats=await this.dbGetAll('cats');const list=document.getElementById('catbook-list');
    const empty=document.getElementById('catbook-empty');
    const unlocked=cats.filter(c=>c.unlocked);
    empty.style.display=unlocked.length===0?'block':'none';
    list.innerHTML=cats.map(c=>{
      if(c.unlocked){
        const ri=c.rarity===6?'👑':c.rarity>=4?'⭐':'';
        const imgSrc=catImg(c);
        return `<div class="cat-card" onclick="App.showCatDetail('${c.id}')" style="border-left:4px solid ${c.rarityColor||'#ccc'}">
          ${imgSrc?`<img src="${imgSrc}" style="width:52px;height:52px;border-radius:50%;object-fit:cover;">`:`<div class="cat-emoji" style="font-size:44px;">🐱</div>`}
          <div class="cat-info"><div class="cname">${c.name} · ${c.nameCN} ${ri}</div><div class="cpersonality">${c.personality}</div></div>
          <div class="cat-stats">来访${c.visitCount||0}次</div>
        </div>`;
      }else{
        return `<div class="cat-card locked" style="border-left:4px solid ${c.rarityColor||'#ccc'}">
          <div style="width:52px;height:52px;border-radius:50%;background:${c.rarityColor||'#ccc'};opacity:.3;display:flex;align-items:center;justify-content:center;font-size:28px;">🐱</div>
          <div class="cat-info"><div class="cname">???</div><div class="cpersonality">🔒 ${c.condition}</div></div>
          <div class="cat-stats"></div>
        </div>`;
      }
    }).join('');
  },

  async showCatDetail(catId){
    const cat=await this.dbGet('cats',catId);if(!cat||!cat.unlocked)return;
    const msgs=await this.dbGetAll('messages');const catMsgs=msgs.filter(m=>m.catId===catId).slice(-10).reverse();
    document.getElementById('cat-modal-content').innerHTML=`
      <div class="cat-detail">${catImg(cat)?`<img src="${catImg(cat)}" style="width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid ${cat.rarityColor||'#ccc'};">`:''}<h2>${cat.name}·${cat.nameCN}</h2><p style="color:var(--text-secondary);">${cat.personality} · ${cat.specialty==='food'?'🍽️':cat.specialty==='travel'?'✈️':'💬'}</p><p style="font-size:13px;color:${cat.rarityColor||'#ccc'};">${['','⬜普通','🟩优良','🟦稀有','🟪史诗','🟧传说','👑神话'][cat.rarity]||''}</p><p style="font-size:13px;">来访${cat.visitCount||0}次</p></div>
      <h4>💬留言记录</h4><div class="cat-msgs">${catMsgs.length===0?'<p style="color:var(--text-secondary);text-align:center;">还没有留言</p>':catMsgs.map(m=>`<div class="cat-msg-item">"${this.esc(m.message)}"<span class="time">${new Date(m.createdAt).toLocaleString('zh-CN')}</span></div>`).join('')}</div>`;
    document.getElementById('cat-modal').classList.add('show');
  },
  closeCatModal(e){if(e.target===document.getElementById('cat-modal'))document.getElementById('cat-modal').classList.remove('show');},

  // ── SETTINGS ──
  async refreshSettings(){const inv=await this.dbGet('inventory','food');document.getElementById('set-fish').textContent=inv?.fish||0;document.getElementById('set-tuna').textContent=inv?.tuna||0;document.getElementById('set-king').textContent=inv?.king||0;},
  async resetAll(){if(!confirm('确定重置？'))return;for(const s of['sentences','inventory','cats','bowls','streaks','messages','progress']){const tx=this.db.transaction(s,'readwrite');tx.objectStore(s).clear();await new Promise(r=>{tx.oncomplete=r;});}await this.seedData();await this.refreshHome();await this.showLevelMap();await this.refreshCatbook();await this.refreshSettings();this.toast('已重置');},

  esc(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');},
};
document.addEventListener('DOMContentLoaded',()=>App.init());
</script>
</body>
